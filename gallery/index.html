<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>jim-uiux</title>
    <script>
      (function(){try{var h=document.documentElement,p=localStorage.getItem("appearance");var d=p==="dark"||(p!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);h.classList.toggle("dark",d);var c=localStorage.getItem("gallery:studio-css");if(c){var s=document.createElement("style");s.id="jim-studio";s.textContent=c;document.head.appendChild(s)}var t=JSON.parse(localStorage.getItem("gallery:studio")||"{}");if(t.density)h.setAttribute("data-density",t.density);if(t.spacing)h.setAttribute("data-spacing",t.spacing);if(localStorage.getItem("gallery:more-contrast")==="1")h.setAttribute("data-contrast","more")}catch(e){}})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
