# jim-uiux gallery + shadcn registry → GitHub Pages, custom domain design.linjiejim.com
# (set in the repo's Pages settings; DNS: CNAME design → linjiejim.github.io).
# Pull requests run the checks only; a push to main also deploys.
# What is live: https://design.linjiejim.com/version.json
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gallery
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: gallery/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gallery/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # A version bump comes with its CHANGELOG.md section (references/patterns/updates.md)
      - run: node src/registry/jim/scripts/release-notes.mjs check --file ../CHANGELOG.md
      - run: pnpm typecheck
      - run: pnpm test
      - name: Registry is up to date
        run: |
          pnpm registry:build
          if [ -n "$(git status --porcelain -- registry.json public/r)" ]; then
            git status --short -- registry.json public/r
            echo "::error::Run 'pnpm registry:build' and commit registry.json + public/r"
            exit 1
          fi
      - run: pnpm build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: gallery/dist

  # Render-level checks on pull requests: axe on every page in four modes, interaction checks,
  # screenshots. Runs in the Playwright image the baselines are made in (`pnpm e2e:baselines`);
  # keep the image tag equal to @playwright/test in gallery/package.json. Doesn't gate deploys.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: gallery
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: gallery/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gallery/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
        env:
          CI: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: gallery/test-results
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The first time a version reaches main and is live, it gets a GitHub release (and tag vX.Y.Z)
  # with its CHANGELOG.md section as the notes (then CHANGELOG.en.md's, after a rule), so projects
  # watching the repo hear about it.
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version gallery/package.json)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version is already released"
            exit 0
          fi
          node gallery/src/registry/jim/scripts/release-notes.mjs notes "$version" --also CHANGELOG.en.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "jim-uiux $version" --notes-file "$RUNNER_TEMP/notes.md"
